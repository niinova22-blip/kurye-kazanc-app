# Gunluk tarife kaynak kontrolu (Katman B). Ubuntu runner: dakikalar 1x sayilir (~1 dk/gun).
# Tarifeyi DEGISTIRMEZ: degisiklikler aday olur, Tarife Merkezi'nde (scripts/server/tariff_center.mjs) onaylanir.
#
# GIZLI DEGERLER (Settings > Secrets and variables > Actions): SUPABASE_PROJECT_REF, SUPABASE_ACCESS_TOKEN.
# Erisim anahtari suresi dolarsa calisma "atlandi" der ve basarili biter (uygulama son yayimlanan tarifeyle calisir).

name: Tarife kontrolu

on:
  schedule:
    - cron: "30 4 * * *"   # her gun 07:30 (Turkiye)
  workflow_dispatch:
    inputs:
      all:
        description: "Tum kaynaklari kontrol et (siklik yok sayilir)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tariff-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Kaynaklari kontrol et
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Supabase gizli degerleri tanimli degil; kontrol atlandi."
            exit 0
          fi
          if [ "${{ inputs.all }}" = "true" ]; then
            node scripts/server/tariff_check.mjs --all
          else
            node scripts/server/tariff_check.mjs
          fi
