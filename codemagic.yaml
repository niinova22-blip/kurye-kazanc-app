# Codemagic CI/CD - Kurye Kazanc (iOS)
#
# Akislar:
#   ios-ci       : main/release disindaki her dal + PR -> proje uret, build, unit test (UI test yalnizca PR'da)
#   ios-release  : main ve release/* dallarina push -> testler + imzali IPA + TestFlight
# (2026-10-10: GitHub Actions kotasi doldugu icin CI/CD tekrar Codemagic'te; .github/workflows yalnizca elle.)
#
# GIZLI BILGILER KODA YAZILMAZ. Codemagic arayuzunde tanimlanmasi gerekenler:
#   1) Teams > Integrations > Developer Portal: App Store Connect API anahtari
#      (Issuer ID, Key ID, .p8 dosyasi). Asagidaki `integrations.app_store_connect` alanina
#      SADECE bu anahtara verdiginiz ad yazilir (mevcut anahtar: "Codemagic").
#   2) Code signing identities: iOS Distribution sertifikasi (veya Codemagic'in otomatik uretmesi)
#      -> `ios_signing` bunu bundle ID uzerinden otomatik bulur.
#   (APP_STORE_APPLE_ID gizli olmadigi icin asagida vars icinde.)
#   Team ID gerekmez; `xcode-project use-profiles` imzalama profilinden alir.

definitions:
  env_versions: &env_versions
    xcode: latest

  vars: &common_vars
    XCODE_PROJECT: "KuryeKazanc.xcodeproj"
    XCODE_SCHEME: "KuryeKazanc"
    BUNDLE_ID: "com.kuryekazanc.app"   # project.yml ile ayni olmali (gizli degil)
    APP_STORE_APPLE_ID: "6819440649"   # App Store Connect uygulama kimligi (gizli degil, App Store adresinde gorunur)

  scripts:
    - &generate_project
      name: XcodeGen ile Xcode projesini uret
      script: |
        brew install xcodegen xcbeautify
        xcodegen generate
    - &build_for_testing
      name: Test icin derle
      script: |
        set -o pipefail
        SIM_ID=$(bash scripts/ci/pick_simulator.sh)
        echo "SIM_ID=$SIM_ID" >> $CM_ENV
        xcodebuild build-for-testing \
          -project "$XCODE_PROJECT" \
          -scheme "$XCODE_SCHEME" \
          -destination "id=$SIM_ID" \
          -derivedDataPath build/DerivedData \
          CODE_SIGNING_ALLOWED=NO \
          | xcbeautify
    - &unit_tests
      name: Birim testleri (XCTest)
      script: |
        set -o pipefail
        xcodebuild test-without-building \
          -project "$XCODE_PROJECT" \
          -scheme "$XCODE_SCHEME" \
          -destination "id=$SIM_ID" \
          -derivedDataPath build/DerivedData \
          -only-testing:KuryeKazancTests \
          -resultBundlePath build/results/UnitTests.xcresult \
          | xcbeautify --report junit --report-path build/test-reports --junit-report-filename unit.xml
      test_report: build/test-reports/unit.xml
    - &ui_tests
      name: UI testleri (XCUITest, simulator)
      script: |
        set -o pipefail
        # Hiz icin: siradan push'ta atlanir; PR'larda ve TestFlight akisinda (RUN_UI_TESTS=true) calisir
        if [ "${CM_PULL_REQUEST:-false}" != "true" ] && [ "${RUN_UI_TESTS:-false}" != "true" ]; then
          echo "UI testleri bu push'ta atlandi (PR degil). Elle calistirmak icin RUN_UI_TESTS=true."
          mkdir -p build/test-reports
          echo '<?xml version="1.0" encoding="UTF-8"?><testsuites name="UI tests skipped" tests="0" failures="0"></testsuites>' > build/test-reports/ui.xml
          exit 0
        fi
        xcodebuild test-without-building \
          -project "$XCODE_PROJECT" \
          -scheme "$XCODE_SCHEME" \
          -destination "id=$SIM_ID" \
          -derivedDataPath build/DerivedData \
          -only-testing:KuryeKazancUITests \
          -resultBundlePath build/results/UITests.xcresult \
          | xcbeautify --report junit --report-path build/test-reports --junit-report-filename ui.xml
      test_report: build/test-reports/ui.xml

workflows:
  ios-ci:
    name: iOS CI (build + test)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *env_versions
      vars:
        <<: *common_vars
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: "*"
          include: true
          source: true
        # Kararli dallar ios-release akisinda test ediliyor; cift calismasin
        - pattern: "main"
          include: false
          source: true
        - pattern: "release/*"
          include: false
          source: true
      cancel_previous_builds: true
    # Yalnizca belge / sunucu / betik degisikliginde iOS derlemesi baslamaz (kuyruk bosuna sifirlanmasin)
    when:
      changeset:
        excludes:
          - '**/*.md'
          - 'docs/**'
          - 'supabase/**'
          - 'scripts/server/**'
          - 'scripts/design/**'
    scripts:
      - *generate_project
      - *build_for_testing
      - *unit_tests
      - *ui_tests
    artifacts:
      - build/results/*.xcresult
      - build/test-reports/*.xml

  ios-release:
    name: iOS Release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: "Codemagic"   # Codemagic'te kayitli API anahtarinin ADI (gizli degil)
    environment:
      <<: *env_versions
      vars:
        <<: *common_vars
        RUN_UI_TESTS: "true"                 # TestFlight'a gitmeden once UI testleri sart
      # Uygulama + paylas eklentisi: iki profil (App Group yetenekli). Onkosul: README > Imzalama.
      ios_signing:
        provisioning_profiles:
          - kurye-kazanc-appstore-v3
          - kurye-kazanc-share-appstore
          - kurye-kazanc-liveactivity-appstore
        certificates:
          - selfwake-distribution
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "main"
          include: true
          source: true
        - pattern: "release/*"
          include: true
          source: true
      cancel_previous_builds: false
    scripts:
      - *generate_project
      - *build_for_testing
      - *unit_tests
      - *ui_tests
      - name: Imzalama profillerini uygula
        script: xcode-project use-profiles
      - name: Build numarasini arttir
        script: |
          if [ -n "${APP_STORE_APPLE_ID:-}" ]; then
            # Ilk yuklemede TestFlight bos olabilir: sayi gelmezse 0 kabul et
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | tail -1)
            case "$LATEST" in ''|*[!0-9]*) LATEST=0 ;; esac
            NEXT=$((LATEST + 1))
          else
            echo "APP_STORE_APPLE_ID tanimli degil; Codemagic BUILD_NUMBER kullaniliyor"
            NEXT=$((BUILD_NUMBER + 1))
          fi
          echo "Build numarasi: $NEXT"
          agvtool new-version -all "$NEXT"
      - name: TestFlight degisiklik notu (What to Test)
        script: bash scripts/ci/make_release_notes.sh
      - name: IPA olustur
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      - build/results/*.xcresult
      - release_notes.json
    publishing:
      app_store_connect:
        auth: integration
        # Harici Beta App Review icin App Store Connect'te test bilgileri gerekir; dahili testciler build'i yine gorur
        submit_to_testflight: false
        # Dahili testciler (App Store Connect kullanicilari) build'i otomatik gorur.
        # Gonullu kuryeler gibi harici testciler icin grup acilinca asagidaki satiri acin
        # (harici grup ilk build'de Apple Beta App Review gerektirir):
        # beta_groups:
        #   - Kurye Testcileri
